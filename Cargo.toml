[package]
name = "rsrs"
version = "0.1.0"
edition = "2021"
resolver= "2"



[features]

default = [
	"mode.test" # NOTE (rs) test is the default mode to make things like bacon or rust-analyzer happy
]

# Assert features

enable_asserts = []

failure_mode_panic = ["enable_asserts"]
failure_mode_break = ["enable_asserts"]
failure_mode_break_and_panic = ["enable_asserts"]
failure_mode_interactive = ["enable_asserts"]

# ID features

name_cache = []

# Build Modes

"mode.normal" = [
	"failure_mode_interactive",
	"name_cache",
]

"mode.test" = [
	"failure_mode_panic",
	"name_cache",
]

"mode.release" = [
]



[dependencies]
assert_macro = { path = "./assert_macro" }
proc_macro = { path = "./proc_macro" }

# External dependencies

colored = "2"
lazy_static = "1"